<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline - GetFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f9fd;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 32px 28px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: #fef3c7;
        color: #b45309;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 24px;
        font-weight: 600;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.5;
        color: #475569;
        font-size: 14px;
      }
      button {
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">!</div>
      <h1>You're offline</h1>
      <p>
        We can't reach GetFlow right now. Check your connection and try
        again — nothing was charged, and no gift was submitted while
        offline.
      </p>
      <button onclick="location.reload()" type="button">Try again</button>
    </div>
  </body>
</html>
